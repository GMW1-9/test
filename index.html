<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Notification Example</title>
</head>
<body>

    <!-- A button to ask for permission safely -->
    <button id="notifyBtn">Enable Notifications</button>

    <script>
        const button = document.getElementById('notifyBtn');

        button.addEventListener('click', () => {
            // 1. Check if the browser supports notifications
            if (!("Notification" in window)) {
                alert("This browser does not support desktop notifications.");
                return;
            }

            // 2. Request permission from the user
            Notification.requestPermission().then((permission) => {
                if (permission === "granted") {
                    // 3. If granted, send a test notification
                    new Notification("Notifications Enabled!", {
                        body: "You will now receive updates from our website.",
                        icon: "https://gmw1-9.github.io/Catholic-PrayerWeb-by-GMW1-9/" // Optional icon URL
                    });
                } else if (permission === "denied") {
                    console.log("User blocked notifications.");
                }
            });
        });
    </script>

</body>
</html>
